<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300">
  <defs>
    <clipPath id="badge"><rect x="385" y="228" width="230" height="38" rx="4"/></clipPath>
    <linearGradient id="shimmer" gradientUnits="userSpaceOnUse" x1="-400" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#D4A441"/>
      <stop offset="0.4" stop-color="#D4A441"/>
      <stop offset="0.5" stop-color="#F5E6B8"/>
      <stop offset="0.6" stop-color="#D4A441"/>
      <stop offset="1" stop-color="#D4A441"/>
      <animate attributeName="x1" values="-400;1000" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;1400" dur="4s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="300" fill="#1E2412"/>

  <!-- twinkling stars (behind text) -->
  <g fill="#D4A441">
    <circle cx="92" cy="58" r="2" opacity="0"><animate attributeName="opacity" values="0;1;0" dur="3s" begin="0s" repeatCount="indefinite"/></circle>
    <circle cx="170" cy="120" r="1.5" opacity="0"><animate attributeName="opacity" values="0;1;0" dur="2.6s" begin="0.7s" repeatCount="indefinite"/></circle>
    <circle cx="110" cy="190" r="2.5" opacity="0"><animate attributeName="opacity" values="0;1;0" dur="3.4s" begin="1.4s" repeatCount="indefinite"/></circle>
    <circle cx="230" cy="245" r="1.5" opacity="0"><animate attributeName="opacity" values="0;1;0" dur="2.8s" begin="0.3s" repeatCount="indefinite"/></circle>
    <circle cx="255" cy="70" r="2" opacity="0"><animate attributeName="opacity" values="0;1;0" dur="3.2s" begin="2.1s" repeatCount="indefinite"/></circle>
    <circle cx="330" cy="215" r="1.5" opacity="0"><animate attributeName="opacity" values="0;1;0" dur="2.4s" begin="1.1s" repeatCount="indefinite"/></circle>
    <circle cx="660" cy="212" r="2" opacity="0"><animate attributeName="opacity" values="0;1;0" dur="3.6s" begin="0.5s" repeatCount="indefinite"/></circle>
    <circle cx="745" cy="66" r="1.5" opacity="0"><animate attributeName="opacity" values="0;1;0" dur="2.7s" begin="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="790" cy="150" r="2.5" opacity="0"><animate attributeName="opacity" values="0;1;0" dur="3.3s" begin="0.2s" repeatCount="indefinite"/></circle>
    <circle cx="850" cy="98" r="2" opacity="0"><animate attributeName="opacity" values="0;1;0" dur="2.9s" begin="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="880" cy="200" r="1.5" opacity="0"><animate attributeName="opacity" values="0;1;0" dur="3.5s" begin="1.0s" repeatCount="indefinite"/></circle>
    <circle cx="920" cy="130" r="2" opacity="0"><animate attributeName="opacity" values="0;1;0" dur="2.5s" begin="1.6s" repeatCount="indefinite"/></circle>
    <circle cx="820" cy="252" r="1.5" opacity="0"><animate attributeName="opacity" values="0;1;0" dur="3.1s" begin="0.9s" repeatCount="indefinite"/></circle>
  </g>

  <!-- corner brackets (slow glow pulse) -->
  <g fill="none" stroke="#D4A441" stroke-width="3" stroke-linecap="square">
    <animate attributeName="opacity" values="0.45;1;0.45" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="stroke-width" values="2;4;2" dur="4s" repeatCount="indefinite"/>
    <path d="M24 64 V24 H64"/>
    <path d="M936 24 H976 V64"/>
    <path d="M24 236 V276 H64"/>
    <path d="M976 236 V276 H936"/>
  </g>

  <!-- pill -->
  <rect x="360" y="44" width="280" height="34" rx="17" fill="none" stroke="#D4A441" stroke-width="1.5"/>
  <text x="500" y="66" text-anchor="middle" font-family="'Fira Code','Courier New',monospace" font-size="13" font-weight="600" letter-spacing="2" fill="#D4A441">CODE → BUILD → DEPLOY</text>

  <!-- name (shimmer sweep) -->
  <text x="500" y="146" text-anchor="middle" font-family="'Fira Code','Courier New',monospace" font-size="48" font-weight="700" letter-spacing="4" fill="url(#shimmer)">SARVAN D SUVARNA</text>

  <!-- subtitle -->
  <text x="500" y="190" text-anchor="middle" font-family="'Fira Code','Courier New',monospace" font-size="16" letter-spacing="3" fill="#D8C9A7">AI &amp; DS ENGINEER · FULL STACK · ML</text>

  <!-- portfolio badge -->
  <g clip-path="url(#badge)">
    <rect x="385" y="228" width="115" height="38" fill="#000000"/>
    <rect x="500" y="228" width="115" height="38" fill="#D4A441"/>
  </g>
  <g font-family="'Verdana','DejaVu Sans',sans-serif" font-size="12" font-weight="700" letter-spacing="1" text-anchor="middle">
    <text x="442.5" y="251" fill="#FFFFFF">PORTFOLIO</text>
    <text x="557.5" y="251" fill="#000000">SARVAN.ME</text>
  </g>
</svg>
