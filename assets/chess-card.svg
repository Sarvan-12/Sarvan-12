<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 110" width="600" height="110">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F8EBC4"/><stop offset="0.45" stop-color="#D4A441"/><stop offset="1" stop-color="#9C7420"/></linearGradient>
    <linearGradient id="bgc" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1e2631"/><stop offset="1" stop-color="#10141a"/></linearGradient>
    <linearGradient id="bd" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D4A441" stop-opacity="0.9"/><stop offset="0.5" stop-color="#4a3f1e"/><stop offset="1" stop-color="#30363d"/></linearGradient>
    <radialGradient id="rg" cx="0.1" cy="0.5" r="0.7"><stop offset="0" stop-color="#D4A441" stop-opacity="0.16"/><stop offset="1" stop-color="#D4A441" stop-opacity="0"/></radialGradient>
    <linearGradient id="hl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.5" stop-color="#fff" stop-opacity="0.28"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <linearGradient id="btn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F8EBC4"/><stop offset="0.5" stop-color="#D4A441"/><stop offset="1" stop-color="#8a6a1f"/></linearGradient>
    <filter id="ts" x="-5%" y="-30%" width="110%" height="180%"><feDropShadow dx="0" dy="1.2" stdDeviation="1" flood-color="#000" flood-opacity="0.7"/></filter>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000" flood-opacity="0.6"/></filter>
  </defs>
  <rect x="0.5" y="0.5" width="599" height="109" rx="10" fill="url(#bgc)" stroke="url(#bd)" stroke-width="1.5"/>
  <rect x="0.5" y="0.5" width="599" height="109" rx="10" fill="url(#rg)"/>
  <line x1="14" x2="586" y1="2" y2="2" stroke="url(#hl)" stroke-width="1"/>
  <!-- pawn icon -->
  <g transform="translate(42 22)" filter="url(#sh)">
    <circle cx="20" cy="12" r="9" fill="url(#gold)"/>
    <path d="M14 20 h12 l3 4 h-18 z" fill="url(#gold)"/>
    <path d="M14 24 C14 34 8 40 8 50 h24 C32 40 26 34 26 24 z" fill="url(#gold)"/>
    <rect x="4" y="50" width="32" height="7" rx="2" fill="url(#gold)"/>
  </g>
  <line x1="98" x2="98" y1="22" y2="88" stroke="#D4A441" stroke-opacity="0.3"/>
  <g font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" filter="url(#ts)">
    <text x="118" y="47" font-size="16" fill="#f0f3f6">I play chess regularly and enjoy competitive games.</text>
    <text x="118" y="73" font-size="15" fill="#9198a1">Open for challenges — let’s play.</text>
  </g>
  <g filter="url(#sh)">
