name: Update profile assets

on:
  schedule:
    - cron: '30 18 * * *' # daily at 18:30 UTC (00:00 IST)
  workflow_dispatch: # allow manual runs from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Rebuild assets/contribution-graph.svg
        run: node scripts/update-contribution-graph.js

      # A GitFut outage should not block the contribution graph update
      - name: Rebuild assets/gitfut-card.svg
        continue-on-error: true
        run: |
          npm install --no-save --no-audit --no-fund sharp
          node scripts/update-gitfut-card.js

      - name: Rebuild project cards (live star and fork counts)
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/update-project-cards.js

      - name: Rebuild assets/quote-card.svg (quote of the day)
        run: node scripts/update-quote.js

      - name: Commit if changed
        run: |
          FILES="assets/contribution-graph.svg assets/gitfut-card.svg assets/card-ai-code-review-tool.svg assets/card-land-use-land-cover.svg assets/card-time-capsule.svg assets/quote-card.svg"
          if git diff --quiet -- $FILES; then
            echo "No changes"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add $FILES
            git commit -m "chore: update contribution graph, GitFut card, project cards and quote"
            git push
          fi
