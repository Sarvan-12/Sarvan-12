name: Update profile assets

on:
  schedule:
    - cron: '30 18 * * *' # daily at 18:30 UTC (00:00 IST)
  workflow_dispatch: # allow manual runs from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Rebuild assets/contribution-graph.svg
        run: node scripts/update-contribution-graph.js

      # A GitFut outage should not block the contribution graph update
      - name: Rebuild assets/gitfut-card.svg
        continue-on-error: true
        run: |
          npm install --no-save --no-audit --no-fund sharp
          node scripts/update-gitfut-card.js

      - name: Commit if changed
        run: |
          if git diff --quiet -- assets/contribution-graph.svg assets/gitfut-card.svg; then
            echo "No changes"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/contribution-graph.svg assets/gitfut-card.svg
            git commit -m "chore: update contribution graph and GitFut card"
            git push
          fi
